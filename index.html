<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Map Sandbox</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }

        .ui {
            position: fixed;
            top: 10px; left: 10px;
            z-index: 10;
            background: #111;
            padding: 10px;
            border-radius: 8px;
        }

        button { margin: 2px; }

        #debugPanel{
            position:fixed;
            top:10px;
            right:10px;
            background:#000;
            color:#0f0;
            font-family:monospace;
            font-size:12px;
            padding:10px;
            border-radius:8px;
            z-index:20;
            max-width:240px;
        }
    </style>
</head>
<body>

<div id="selectionToolbar" style="
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(20, 20, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', system-ui, sans-serif;
    color: white;
">
    <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.6); margin-right: 4px; user-select: none;">Tools:</div>
    <button onclick="setTool('box')" id="btnToolBox" style="
        background: #007bff;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    ">Box Select (B)</button>
    <button onclick="setTool('lasso')" id="btnToolLasso" style="
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    ">Lasso Select (L)</button>
    <button onclick="setTool('pan')" id="btnToolPan" style="
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    ">Pan / Move (H)</button>
    
    <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 4px;"></div>
    
    <button onclick="selectAllProvincesOfSelectedCountry()" style="
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    ">Select Country (S)</button>
    
    <select id="selLogicMode" style="
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 5px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        outline: none;
    ">
        <option value="replace" style="background: #222; color: white;">Replace Mode (1)</option>
        <option value="add" style="background: #222; color: white;">Add Mode (2)</option>
        <option value="subtract" style="background: #222; color: white;">Subtract Mode (3)</option>
        <option value="intersect" style="background: #222; color: white;">Intersect Mode (4)</option>
        <option value="xor" style="background: #222; color: white;">XOR Toggle Mode (5)</option>
    </select>
    
    <select id="selMapmode" onchange="setMapmode(this.value)" style="
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 5px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        outline: none;
    ">
        <option value="political" style="background: #222; color: white;">Political Mapmode</option>
        <option value="interest" style="background: #222; color: white;">National Interest</option>
    </select>
    
    <button onclick="clearSelection()" style="
        background: rgba(255, 69, 58, 0.15);
        color: rgb(255, 69, 58);
        border: 1px solid rgba(255, 69, 58, 0.2);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    ">Clear (C)</button>
 
    <button onclick="toggleSelectedWater()" style="
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    ">Toggle Land/Water</button>
 
    <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 4px;"></div>
 
    <button onclick="paintSelection()" style="
        background: #28a745;
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(40, 167, 69, 0.4);
    ">Paint Selected (Enter)</button>
</div>
 
<div class="ui" style="max-height: 90vh; overflow-y: auto; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); background: rgba(17,17,17,0.9); border: 1px solid #333; border-radius: 8px; padding: 12px; box-sizing: border-box;">
    <div style="font-weight: bold; color: white; margin-bottom: 8px; font-family: sans-serif;">Map Editor</div>
    <div style="display: flex; gap: 4px; margin-bottom: 8px;">
        <button id="btnEraser" onclick="setEraser()" style="flex: 1; padding: 4px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 12px;">Eraser (E)</button>
        <button onclick="resetMap()" style="flex: 1; padding: 4px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 12px;">Reset</button>
    </div>
    
    <div style="margin-bottom: 8px;">
        <input type="text" id="countrySearch" placeholder="Search countries..." style="width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; font-size: 12px;" oninput="filterCountries()">
    </div>
    
    <div id="countryList" style="display: flex; flex-direction: column; gap: 3px; max-height: 250px; overflow-y: auto; border: 1px solid #333; padding: 4px; border-radius: 4px; background: #111; margin-bottom: 8px;">
    </div>
    
    <!-- Selection Status -->
    <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 4px; font-family: sans-serif; font-size: 12px; color: white;">
        <div style="font-weight: bold; color: #007bff;">Selection Status</div>
        <div id="selectionStatus" style="font-size: 11px; color: #aaa; font-style: italic;">Selected: 0 provinces</div>
    </div>

    <!-- National Interest Panel -->
    <div id="interestPanel" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 6px; font-family: sans-serif; font-size: 12px; color: white;">
        <div style="font-weight: bold; color: #ff9500; display: flex; align-items: center; justify-content: space-between;">
            <span>National Interest</span>
            <span id="interestValueDisp" style="font-family: monospace; font-size: 11px; background: rgba(255, 149, 0, 0.2); padding: 2px 6px; border-radius: 4px;">5</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <input type="range" id="interestSlider" min="1" max="10" value="5" oninput="document.getElementById('interestValueDisp').innerText = this.value" style="flex: 1; accent-color: #ff9500; cursor: pointer;">
        </div>
        <div style="display: flex; gap: 4px;">
            <button onclick="paintInterest()" style="flex: 1.2; padding: 5px; background: #ff9500; color: black; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s ease;">Paint Interest (I)</button>
            <button onclick="clearInterest()" style="flex: 0.8; padding: 5px; background: #444; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s ease;">Clear</button>
        </div>
    </div>

    <!-- Selected Country Panel -->
    <div id="countryControlsPanel" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 6px; font-family: sans-serif; font-size: 12px; color: white;">
        <div style="font-weight: bold; color: #007bff; display: flex; align-items: center; justify-content: space-between;">
            <span>Country Options</span>
            <span id="activeCountryTag" style="font-family: monospace; font-size: 11px; background: rgba(0, 123, 255, 0.2); padding: 2px 6px; border-radius: 4px;">None</span>
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="flex-shrink: 0; width: 60px;">Rename:</label>
            <input type="text" id="editCountryName" style="flex: 1; background: #222; border: 1px solid #444; color: white; padding: 4px; border-radius: 4px; font-size: 11px;" onchange="handleRenameFromInput(this.value)">
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="flex-shrink: 0; width: 60px;">Recolour:</label>
            <input type="color" id="editCountryColor" style="width: 40px; height: 22px; border: none; padding: 0; background: none; cursor: pointer;" oninput="handleRecolourFromPicker(this.value)">
            <button onclick="activateColorPickerTool()" id="btnColorPickerTool" style="flex: 1; padding: 4px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s ease;">
                Pick from Map (P)
            </button>
        </div>
    </div>

    <div id="debugControls" style="
        margin-top:8px;
        color:white;
        font-family:sans-serif;
        font-size:12px;
        display:flex;
        flex-direction:column;
        gap:2px;
    ">
        <label><input type="checkbox" id="dbgAxis" checked> Axis</label>
        <label><input type="checkbox" id="dbgBezier" checked> Bezier</label>
        <label><input type="checkbox" id="dbgPoints" checked> Control Points</label>
        <label><input type="checkbox" id="dbgPanelToggle" checked> Debug Panel</label>
        <label><input type="checkbox" id="dbgHeightmap" checked> Heightmap</label>
    </div>
</div>

<div id="debugPanel"></div>
<div id="provincePanel" style="
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: rgba(17, 17, 17, 0.95);
    border: 1px solid #333;
    color: white;
    font-family: sans-serif;
    font-size: 13px;
    padding: 15px;
    border-radius: 8px;
    z-index: 25;
    width: 250px;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
">
    <div style="font-weight: bold; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
        <span>Province Editor</span>
        <button onclick="document.getElementById('provincePanel').style.display='none'" style="background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px;">&times;</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <div>ID: <span id="pnlId" style="font-family: monospace; font-weight: bold;"></span></div>
        <div>Color: <span id="pnlColor" style="font-family: monospace;"></span></div>
        <div>
            <label style="display: block; margin-bottom: 2px;">Name:</label>
            <input type="text" id="pnlName" style="width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: white; padding: 4px; border-radius: 4px;">
        </div>
        <div>
            <label style="display: block; margin-bottom: 2px;">Type:</label>
            <select id="pnlType" style="width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: white; padding: 4px; border-radius: 4px;">
                <option value="land">Land</option>
                <option value="water">Water</option>
            </select>
        </div>
        <div>
            <label style="display: block; margin-bottom: 2px;">Terrain:</label>
            <select id="pnlTerrain" style="width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: white; padding: 4px; border-radius: 4px;">
                <option value="plains">Plains</option>
                <option value="forest">Forest</option>
                <option value="mountain">Mountain</option>
                <option value="hills">Hills</option>
                <option value="marsh">Marsh</option>
                <option value="water">Water</option>
            </select>
        </div>
        <div>
            <label style="display: block; margin-bottom: 2px;">Detailed:</label>
            <div id="pnlDetailedTerrain" style="font-family: monospace; font-size: 11px; color: #bbb; background: #222; border: 1px solid #333; padding: 5px; border-radius: 4px; word-break: break-all; min-height: 15px;"></div>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 5px;">
            <button onclick="saveProvinceDetails()" style="flex: 1; padding: 6px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer;">Save Prov</button>
            <button onclick="exportDefinitions()" style="flex: 1; padding: 6px; background: #28a745; border: none; color: white; border-radius: 4px; cursor: pointer;">Export Defs</button>
        </div>
    </div>
</div>

<!-- Global Map Controls (Save Preset & Export JSON) -->
<div style="
    position: fixed;
    bottom: 15px;
    left: 15px;
    z-index: 100;
    background: rgba(20, 20, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    font-family: 'Inter', system-ui, sans-serif;
">
    <button onclick="saveWorldPreset()" style="
        background: #007bff;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(0, 123, 255, 0.4);
    ">Save Starting Preset</button>
    <button onclick="exportWorldJSON()" style="
        background: #28a745;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(40, 167, 69, 0.4);
    ">Export JSON</button>
</div>
<div style="position: relative; width: 100vw; height: 100vh;">
    <canvas id="mapCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
    <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
</div>

<script>

const canvas = document.getElementById("mapCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");
const overlayCtx = overlayCanvas.getContext("2d");
const debugPanel = document.getElementById("debugPanel");

const baseCanvas = document.createElement("canvas");
const baseCtx = baseCanvas.getContext("2d");

const DEBUG = {
    axis: true,
    bezier: true,
    points: true,
    panel: true
};

const img = new Image();
const indexImg = new Image();
const heightmapImg = new Image();
let meta = null;
let hasHeightmap = false;
let showHeightmap = 1.0;
let presetData = null;

let zoom = 1;
let offsetX = 0.0;
let offsetY = 0.0;
let isPanning = false;
let startPanX = 0;
let startPanY = 0;
let startOffsetX = 0;
let startOffsetY = 0;

let ownership = {};
let interests = {}; // countryTag -> { provinceId: level (1-10) }
let activeMapmode = "political"; // "political" or "interest"
let provinceKeys = [];
const labelCache = {};
const provinceCenters = {};
const provinceNeighbors = {};
const dirtyCountries = new Set();
let eraserMode = false;
let definitions = {};
const colorToId = {};

let COLORS = {
    yellow: [255,255,0],
    red: [255,0,0],
    blue: [0,120,255],
    green: [0,200,0]
};

let countries = {
    yellow: {
        tag: "YLW",
        name: "Yellow",
        color: [255,255,0],
        provinces: new Set()
    },
    red: {
        tag: "RED",
        name: "Red",
        color: [255,0,0],
        provinces: new Set()
    },
    blue: {
        tag: "BLU",
        name: "Blue",
        color: [0,120,255],
        provinces: new Set()
    },
    green: {
        tag: "GRN",
        name: "Green",
        color: [0,200,0],
        provinces: new Set()
    }
};

let selectedColor = "yellow";

function selectCountry(tag) {
    selectedColor = tag;
    eraserMode = false;
    
    const eraserBtn = document.getElementById("btnEraser");
    if (eraserBtn) {
        eraserBtn.style.background = "#333";
    }
    
    // Highlight the selected country in the list
    const items = document.querySelectorAll(".country-item");
    items.forEach(item => {
        if (item.dataset.tag === tag) {
            item.style.border = "2px solid white";
            item.style.background = "#333";
            item.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } else {
            item.style.border = "1px solid #333";
            item.style.background = "#222";
        }
    });

    // Update Country Options panel
    const activeTagLabel = document.getElementById("activeCountryTag");
    if (activeTagLabel) {
        activeTagLabel.textContent = tag;
    }
    const editNameInput = document.getElementById("editCountryName");
    if (editNameInput) {
        editNameInput.value = countries[tag] ? countries[tag].name : "";
    }
    const editColorInput = document.getElementById("editCountryColor");
    if (editColorInput && countries[tag]) {
        const rgb = countries[tag].color;
        const hex = "#" + ((1 << 24) + (rgb[0] << 16) + (rgb[1] << 8) + rgb[2]).toString(16).slice(1);
        editColorInput.value = hex;
    }

    updateAllLutAlphas();
    requestDraw();
}

function updateCountryList() {
    const list = document.getElementById("countryList");
    if (!list) return;
    list.innerHTML = "";
    
    // Sort countries alphabetically by tag
    const sortedTags = Object.keys(countries).sort();
    
    sortedTags.forEach(tag => {
        const c = countries[tag];
        const item = document.createElement("div");
        item.className = "country-item";
        item.dataset.tag = tag;
        
        const colStr = `rgb(${c.color[0]}, ${c.color[1]}, ${c.color[2]})`;
        
        item.style.cssText = `
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            margin-bottom: 2px;
        `;
        
        item.onclick = () => selectCountry(tag);
        
        const colorBox = document.createElement("div");
        colorBox.style.cssText = `
            width: 12px;
            height: 12px;
            background: ${colStr};
            border-radius: 2px;
            border: 1px solid #555;
            flex-shrink: 0;
        `;
        
        const tagLabel = document.createElement("span");
        tagLabel.textContent = tag;
        tagLabel.style.fontWeight = "bold";
        tagLabel.style.width = "40px";
        tagLabel.style.flexShrink = "0";
        
        const nameLabel = document.createElement("span");
        nameLabel.textContent = c.name;
        nameLabel.style.color = "#888";
        nameLabel.style.fontSize = "11px";
        nameLabel.style.whiteSpace = "nowrap";
        nameLabel.style.overflow = "hidden";
        nameLabel.style.textOverflow = "ellipsis";
        
        item.appendChild(colorBox);
        item.appendChild(tagLabel);
        item.appendChild(nameLabel);
        list.appendChild(item);
    });
    
    if (sortedTags.length > 0) {
        selectCountry(sortedTags[0]);
    }
}

function filterCountries() {
    const query = document.getElementById("countrySearch").value.toUpperCase();
    const items = document.querySelectorAll(".country-item");
    items.forEach(item => {
        const tag = item.dataset.tag;
        const name = countries[tag].name.toUpperCase();
        if (tag.includes(query) || name.includes(query)) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
    });
}

function setColor(c){ selectedColor=c; eraserMode=false; }
function setEraser() {
	eraserMode = true;
	selectedColor = null;
	const eraserBtn = document.getElementById("btnEraser");
	if (eraserBtn) {
		eraserBtn.style.background = "#007bff";
	}
	const items = document.querySelectorAll(".country-item");
	items.forEach(item => {
		item.style.border = "1px solid #333";
		item.style.background = "#222";
	});
}
function resetMap(){

    ownership = {};
    interests = {};

    for(const c in countries){
        countries[c].provinces.clear();
        interests[c] = {};
    }

    dirtyCountries.clear();

    for(const k in labelCache){
        delete labelCache[k];
    }

    if (lutData) {
        for (let i = 0; i < lutWidth * lutHeight; i++) {
            const o = i * 4;
            lutData[o] = 180;
            lutData[o+1] = 180;
            lutData[o+2] = 180;
            lutData[o+3] = 255;
        }
        for (const keyStr in meta.centers) {
            const centerData = meta.centers[keyStr];
            if (centerData.is_water) {
                const o = centerData.index * 4;
                lutData[o] = 150;
                lutData[o+1] = 180;
                lutData[o+2] = 210;
            }
        }
        
        // Reload preset ownership and interests if available
        if (presetData) {
            for (const provIdStr in presetData.ownership) {
                const provId = parseInt(provIdStr);
                const tag = presetData.ownership[provIdStr];
                if (countries[tag] && provinceCenters[provId]) {
                    ownership[provId] = tag;
                    countries[tag].provinces.add(provId);
                    
                    const idx = provinceCenters[provId].index;
                    const colorRgb = COLORS[tag];
                    const o = idx * 4;
                    lutData[o] = colorRgb[0];
                    lutData[o+1] = colorRgb[1];
                    lutData[o+2] = colorRgb[2];
                }
            }
            if (presetData.interests) {
                for (const tag in presetData.interests) {
                    if (!interests[tag]) interests[tag] = {};
                    for (const provIdStr in presetData.interests[tag]) {
                        interests[tag][parseInt(provIdStr)] = parseInt(presetData.interests[tag][provIdStr]);
                    }
                }
            }
        }
        
        lutNeedsUpdate = true;
    }

    for (const tag in countries) {
        dirtyCountries.add(tag);
    }

    updateAllLutAlphas();
    draw();
}
function renameCountry(color, newName) {
    if (!countries[color]) return;
    countries[color].name = newName;
    dirtyCountries.add(color);
    for (const k in labelCache) {
        delete labelCache[k];
    }
    requestDraw();
}
function setCountryTag(color, tag) {
    if (!countries[color]) return;
    countries[color].tag = tag;
}

function compileShader(gl, source, type) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error("Shader compile error: " + gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

function linkProgram(gl, vs, fs) {
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error("Program link error: " + gl.getProgramInfoLog(program));
        return null;
    }
    return program;
}

let gl;
let program;
let indexTexture;
let lutTexture;
let heightmapTexture;
let lutData;
let lutWidth = 2048;
let lutHeight = 16;
let lutNeedsUpdate = true;
let showBorders = 1.0;
let waterIdx = -1;

const vsSource = `
    attribute vec2 a_position;
    varying vec2 v_texCoord;
    uniform vec2 u_offset;
    uniform float u_zoom;
    uniform vec2 u_resolution;
    uniform vec2 u_mapSize;

    void main() {
        vec2 worldPos = a_position * u_mapSize;
        vec2 screenPos = (worldPos - u_offset) * u_zoom;
        vec2 clipSpace = (screenPos / u_resolution) * 2.0 - 1.0;
        gl_Position = vec4(clipSpace.x, -clipSpace.y, 0.0, 1.0);
        v_texCoord = a_position;
    }
`;

const fsSource = `
    precision highp float;
    varying vec2 v_texCoord;
    uniform sampler2D u_indexTexture;
    uniform sampler2D u_lutTexture;
    uniform sampler2D u_heightmapTexture;
    uniform vec2 u_texelSize;
    uniform float u_lutWidth;
    uniform float u_lutHeight;
    uniform float u_showBorders;
    uniform float u_showHeightmap;
    uniform vec2 u_mapSize;
    uniform float u_zoom;
    uniform float u_activeMapmode;

    void main() {
        vec4 indexColor = texture2D(u_indexTexture, v_texCoord);
        
        float r = floor(indexColor.r * 255.0 + 0.5);
        float g = floor(indexColor.g * 255.0 + 0.5);
        float b = floor(indexColor.b * 255.0 + 0.5);
        float idx = r + g * 256.0 + b * 65536.0;
        
        float u = (mod(idx, u_lutWidth) + 0.5) / u_lutWidth;
        float v = (floor(idx / u_lutWidth) + 0.5) / u_lutHeight;
        vec4 lutColor = texture2D(u_lutTexture, vec2(u, v));
        vec4 color = vec4(lutColor.rgb, 1.0);
        vec3 baseCountryColor = color.rgb;
        
        if (u_showHeightmap > 0.5) {
            float h = texture2D(u_heightmapTexture, v_texCoord).r;
            float hR = texture2D(u_heightmapTexture, v_texCoord + vec2(u_texelSize.x, 0.0)).r;
            float hD = texture2D(u_heightmapTexture, v_texCoord + vec2(0.0, u_texelSize.y)).r;
            
            float scale = 30.0;
            float dx = (hR - h) * scale;
            float dy = (hD - h) * scale;
            
            vec3 normal = normalize(vec3(-dx, -dy, 1.0));
            vec3 lightDir = normalize(vec3(-1.0, -1.0, 1.5));
            float light = dot(normal, lightDir);
            
            float shadow = 0.5 + 0.5 * light;
            shadow = clamp(shadow, 0.6, 1.4);
            color = vec4(color.rgb * shadow, 1.0);
        }

        // Apply National Interest Overlay
        if (u_activeMapmode > 0.5) {
            float interestLevel = floor(lutColor.a * 255.0 + 0.5);
            if (interestLevel > 0.5) {
                vec2 mapCoord = v_texCoord * u_mapSize;
                float baseOpacity = 0.05 + (interestLevel / 10.0) * 0.20;
                float stripe = sin((mapCoord.x + mapCoord.y) * 0.4);
                float threshold = 1.0 - (interestLevel / 10.0) * 0.6; 
                float stripeActive = step(threshold, stripe);
                vec3 interestColor = vec3(0.95, 0.25, 0.1); 
                float overlayAlpha = baseOpacity + stripeActive * 0.25 * (interestLevel / 10.0);
                overlayAlpha = clamp(overlayAlpha, 0.0, 0.7);
                color.rgb = mix(color.rgb, interestColor, overlayAlpha);
            } else {
                // Desaturate non-interest provinces to make the interests stand out
                color.rgb = mix(color.rgb, vec3(dot(color.rgb, vec3(0.299, 0.587, 0.114))), 0.4);
            }
        }
        
        if (u_showBorders > 0.5) {
            // Step size is exactly one screen pixel in texture coordinates!
            vec2 step = 1.0 / (u_mapSize * u_zoom);
            
            // Check country borders first in all 4 directions with a radius of 2px
            bool isCountryBorder = false;
            
            vec2 offsets[8];
            offsets[0] = vec2(step.x, 0.0);
            offsets[1] = vec2(-step.x, 0.0);
            offsets[2] = vec2(0.0, step.y);
            offsets[3] = vec2(0.0, -step.y);
            offsets[4] = vec2(step.x * 2.0, 0.0);
            offsets[5] = vec2(-step.x * 2.0, 0.0);
            offsets[6] = vec2(0.0, step.y * 2.0);
            offsets[7] = vec2(0.0, -step.y * 2.0);
            
            for (int i = 0; i < 8; i++) {
                vec4 nIdxCol = texture2D(u_indexTexture, v_texCoord + offsets[i]);
                float nr = floor(nIdxCol.r * 255.0 + 0.5);
                float ng = floor(nIdxCol.g * 255.0 + 0.5);
                float nb = floor(nIdxCol.b * 255.0 + 0.5);
                float nIdx = nr + ng * 256.0 + nb * 65536.0;
                
                float nu = (mod(nIdx, u_lutWidth) + 0.5) / u_lutWidth;
                float nv = (floor(nIdx / u_lutWidth) + 0.5) / u_lutHeight;
                vec4 nCountryColor = texture2D(u_lutTexture, vec2(nu, nv));
                
                if (distance(baseCountryColor, nCountryColor.rgb) > 0.002) {
                    isCountryBorder = true;
                    break;
                }
            }
            
            if (isCountryBorder) {
                // Country border: thick solid black line
                color = vec4(0.0, 0.0, 0.0, 1.0);
            } else {
                // Provincial border check (only at 1px distance)
                vec4 indexColorR = texture2D(u_indexTexture, v_texCoord + vec2(step.x, 0.0));
                vec4 indexColorD = texture2D(u_indexTexture, v_texCoord + vec2(0.0, step.y));
                
                float idxR = floor(indexColorR.r * 255.0 + 0.5) + floor(indexColorR.g * 255.0 + 0.5)*256.0 + floor(indexColorR.b * 255.0 + 0.5)*65536.0;
                float idxD = floor(indexColorD.r * 255.0 + 0.5) + floor(indexColorD.g * 255.0 + 0.5)*256.0 + floor(indexColorD.b * 255.0 + 0.5)*65536.0;
                
                bool isProvBorder = (idx != idxR) || (idx != idxD);
                if (isProvBorder) {
                    // Provincial border opacity scales with zoom to prevent clutter when zoomed out
                    float provOpacity = clamp((u_zoom - 0.3) * 0.35, 0.0, 0.22);
                    color = vec4(mix(color.rgb, vec3(0.0), provOpacity), color.a);
                }
            }
        }
        
        gl_FragColor = color;
    }
`;

function initWebGL() {
    gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) {
        alert("WebGL not supported!");
        return;
    }

    const vs = compileShader(gl, vsSource, gl.VERTEX_SHADER);
    const fs = compileShader(gl, fsSource, gl.FRAGMENT_SHADER);
    program = linkProgram(gl, vs, fs);
    gl.useProgram(program);

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    const quadVertices = new Float32Array([
        0, 0,
        1, 0,
        0, 1,
        0, 1,
        1, 0,
        1, 1
    ]);
    gl.bufferData(gl.ARRAY_BUFFER, quadVertices, gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(positionLocation);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

    indexTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, indexTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, indexImg);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    // Calculate LUT texture height dynamically based on the loaded province count
    lutWidth = 2048;
    lutHeight = Math.ceil(meta.province_count / lutWidth);
    if (lutHeight < 1) lutHeight = 1;

    lutTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, lutTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    lutData = new Uint8Array(lutWidth * lutHeight * 4);
    for (let i = 0; i < lutWidth * lutHeight; i++) {
        const o = i * 4;
        lutData[o] = 180;
        lutData[o+1] = 180;
        lutData[o+2] = 180;
        lutData[o+3] = 255;
    }
    for (const keyStr in meta.centers) {
        const centerData = meta.centers[keyStr];
        if (centerData.is_water) {
            const o = centerData.index * 4;
            lutData[o] = 150;
            lutData[o+1] = 180;
            lutData[o+2] = 210;
        }
    }
    lutNeedsUpdate = true;

    heightmapTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, heightmapTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
}

function applySelectionLogic(newSelection) {
    const mode = document.getElementById("selLogicMode").value;
    if (mode === "replace") {
        selectedProvinces = new Set(newSelection);
    } else if (mode === "add") {
        for (const key of newSelection) {
            selectedProvinces.add(key);
        }
    } else if (mode === "subtract") {
        for (const key of newSelection) {
            selectedProvinces.delete(key);
        }
    } else if (mode === "intersect") {
        selectedProvinces = new Set([...selectedProvinces].filter(key => newSelection.has(key)));
    } else if (mode === "xor") {
        for (const key of newSelection) {
            if (selectedProvinces.has(key)) {
                selectedProvinces.delete(key);
            } else {
                selectedProvinces.add(key);
            }
        }
    }
}

function selectAllProvincesOfSelectedCountry() {
    let targetProvinces = new Set();
    if (eraserMode || !selectedColor) {
        // Select all ownerless/unowned land provinces
        for (const keyStr in provinceCenters) {
            const key = parseInt(keyStr);
            const p = provinceCenters[keyStr];
            if (p && !p.isWater && !ownership[key]) {
                targetProvinces.add(key);
            }
        }
    } else {
        const countryObj = countries[selectedColor];
        if (countryObj) {
            targetProvinces = countryObj.provinces;
        }
    }
    
    applySelectionLogic(targetProvinces);
    updateSelectionStatus();
    requestDraw();
}

function toggleSelectedWater() {
    if (selectedProvinces.size === 0) return;
    
    for (const pid of selectedProvinces) {
        const center = provinceCenters[pid];
        if (center) {
            const wasWater = center.isWater;
            center.isWater = !wasWater;
            
            // Also update definitions
            const d = definitions[pid];
            if (d) {
                d.type = center.isWater ? "water" : "land";
            }
            
            if (center.isWater) {
                // If it became water, remove ownership
                const oldOwner = ownership[pid];
                if (oldOwner && countries[oldOwner]) {
                    countries[oldOwner].provinces.delete(pid);
                }
                delete ownership[pid];
            }
            
            // Update LUT color in real-time
            if (lutData) {
                const index = center.index;
                if (center.isWater) {
                    updateLutForProvince(index, [150, 180, 210]);
                } else {
                    const owner = ownership[pid];
                    if (owner && COLORS[owner]) {
                        updateLutForProvince(index, COLORS[owner]);
                    } else {
                        updateLutForProvince(index, [180, 180, 180]);
                    }
                }
            }
        }
    }
    
    // Clear cache to recalculate labels
    for (const k in labelCache) {
        delete labelCache[k];
    }
    
    requestDraw();
}

function paintSelection() {
    if (selectedProvinces.size === 0) return;
    
    const targetTag = eraserMode ? null : selectedColor;
    
    for (const key of selectedProvinces) {
        const old = ownership[key];
        if (old && countries[old]) {
            countries[old].provinces.delete(key);
            dirtyCountries.add(old);
        }
        
        if (targetTag) {
            ownership[key] = targetTag;
            countries[targetTag].provinces.add(key);
            dirtyCountries.add(targetTag);
            if (provinceCenters[key]) {
                updateLutForProvince(provinceCenters[key].index, COLORS[targetTag]);
            }
        } else {
            delete ownership[key];
            if (provinceCenters[key]) {
                updateLutForProvince(provinceCenters[key].index, [180, 180, 180]);
            }
        }
    }
    
    selectedProvinces.clear();
    updateSelectionStatus();
    updateAllLutAlphas();
    for (const k in labelCache) {
        delete labelCache[k];
    }
    draw();
}

function isPointInPolygon(pt, poly) {
	let x = pt.x, y = pt.y;
	let inside = false;
	for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
		let xi = poly[i].x, yi = poly[i].y;
		let xj = poly[j].x, yj = poly[j].y;
		let intersect = ((yi > y) !== (yj > y))
			&& (x < (xj - xi) * (y - yi) / (yj - yi || 1) + xi);
		if (intersect) inside = !inside;
	}
	return inside;
}

    definitions[id].type = newType;
    definitions[id].terrain = newTerrain;

    // Update water flag in centers metadata
    const parsedId = parseInt(id);
    if (provinceCenters[parsedId]) {
        provinceCenters[parsedId].isWater = (newType === "water");
        
        // Update LUT color in real-time
        if (lutData) {
            const index = provinceCenters[parsedId].index;
            if (newType === "water") {
                updateLutForProvince(index, [150, 180, 210]);
            } else {
                // Check if owned by a country
                const owner = ownership[parsedId];

                } else {
                    updateLutForProvince(index, [180, 180, 180]);
                }
            }
        }
    }
    
    // Clear cache to recalculate labels (as straight/curvy might change if type changes water status)
    for (const k in labelCache) {
        delete labelCache[k];
    }
    
    draw();
}

function getWorldPresetData() {
    const data = {
        countries: {},
        ownership: {},
        interests: {}
    };
    for (const tag in countries) {
        data.countries[tag] = {
            name: countries[tag].name,
            color: countries[tag].color
        };
    }
    for (const provId in ownership) {
        data.ownership[provId] = ownership[provId];
    }
    for (const tag in interests) {
        if (Object.keys(interests[tag]).length > 0) {
            data.interests[tag] = {};
            for (const provId in interests[tag]) {
                data.interests[tag][provId] = interests[tag][provId];
            }
        }
    }
    return data;
}

function updateLutForProvince(idx, colorRgb) {
    const offset = idx * 4;
    lutData[offset] = colorRgb[0];
    lutData[offset+1] = colorRgb[1];
    lutData[offset+2] = colorRgb[2];
    lutNeedsUpdate = true;
}

function updateAllLutAlphas() {
    if (!lutData) return;
    
    for (let i = 0; i < lutWidth * lutHeight; i++) {
        lutData[i * 4 + 3] = 0;
    }
    
    if (selectedColor && interests[selectedColor]) {
        for (const provIdStr in interests[selectedColor]) {
            const provId = parseInt(provIdStr);
            const level = interests[selectedColor][provId];
            const p = provinceCenters[provId];
            if (p) {
                lutData[p.index * 4 + 3] = level;
            }
        }
    }
    lutNeedsUpdate = true;
}

function setMapmode(mode) {
    activeMapmode = mode;
    updateAllLutAlphas();
    requestDraw();
}

function paintInterest() {
    if (!selectedColor) {
        alert("Please select a country first.");
        return;
    }
    if (selectedProvinces.size === 0) {
        alert("Please select one or more provinces to paint interest.");
        return;
    }
    const val = parseInt(document.getElementById("interestSlider").value);
    if (!interests[selectedColor]) {
        interests[selectedColor] = {};
    }
    for (const pid of selectedProvinces) {
        interests[selectedColor][pid] = val;
    }
    updateAllLutAlphas();
    requestDraw();
}

function clearInterest() {
    if (!selectedColor) return;
    if (selectedProvinces.size === 0) return;
    if (interests[selectedColor]) {
        for (const pid of selectedProvinces) {
            delete interests[selectedColor][pid];
        }
    }
    updateAllLutAlphas();
    requestDraw();
}

const provinceIdCache = {};
function getProvinceIdAt(x, y) {
	if (x < 0 || y < 0 || x >= img.width || y >= img.height) return 0;
	const ix = Math.floor(x);
	const iy = Math.floor(y);
	const cacheKey = (iy << 16) | ix;
	if (provinceIdCache[cacheKey] !== undefined) {
		return provinceIdCache[cacheKey];
	}
	
	const idx = (iy * img.width + ix) * 4;
	const r = basePixels[idx];
	const g = basePixels[idx+1];
	const b = basePixels[idx+2];
	const a = 255; // Force 255 to match definitions key
	let key = (((r << 24) >>> 0) | (g << 16) | (b << 8) | a) >>> 0;
	
	let result = 0;
	if (colorToId[key] !== undefined) {
		result = colorToId[key];
	} else {
		// Fallback closest color match
		let bestId = 0;
		let minDiff = Infinity;
		for (const idStr in definitions) {
			const d = definitions[idStr];
			const kr = d.color[0];
			const kg = d.color[1];
			const kb = d.color[2];
			const diff = Math.abs(r - kr) + Math.abs(g - kg) + Math.abs(b - kb);
			if (diff < minDiff) {
				minDiff = diff;
				bestId = parseInt(idStr);
			}
		}
		result = bestId;
	}
	provinceIdCache[cacheKey] = result;
	return result;
}

function screenToMap(clientX, clientY) {
	const rect = canvas.getBoundingClientRect();
	const x = clientX - rect.left;
	const y = clientY - rect.top;
	return [
		Math.floor(x / zoom + offsetX),
		Math.floor(y / zoom + offsetY)
	];
}

canvas.addEventListener("mousedown", e => {
	if (e.button === 2 || e.button === 1 || activeTool === "pan") { // Right/Middle click or Pan tool to pan
		isDragging = false;
		isPanning = true;
		startPanX = e.clientX;
		startPanY = e.clientY;
		startOffsetX = offsetX;
		startOffsetY = offsetY;
		e.preventDefault();
		return;
	}

	if (e.button === 0) { // Left click to select
		const [mapX, mapY] = screenToMap(e.clientX, e.clientY);
		isDragging = true;
		if (activeTool === "box") {
			selectionBox = { startX: mapX, startY: mapY, endX: mapX, endY: mapY };
		} else if (activeTool === "lasso") {
			lassoPoints = [{x: mapX, y: mapY}];
		}
	}
});

canvas.addEventListener("mousemove", e => {
	if (isPanning) {
		const dx = e.clientX - startPanX;
		const dy = e.clientY - startPanY;
		offsetX = startOffsetX - dx / zoom;
		offsetY = startOffsetY - dy / zoom;
		requestDraw();
		return;
	}

	if (isDragging) {
		const [mapX, mapY] = screenToMap(e.clientX, e.clientY);
		if (activeTool === "box" && selectionBox) {
			selectionBox.endX = mapX;
			selectionBox.endY = mapY;
			requestDraw();
		} else if (activeTool === "lasso" && lassoPoints) {
			lassoPoints.push({x: mapX, y: mapY});
			requestDraw();
		}
	}
});

window.addEventListener("mouseup", e => {
	if (isPanning) {
		isPanning = false;
		if (e.button === 2) {
			const dx = e.clientX - startPanX;
			const dy = e.clientY - startPanY;
			if (Math.hypot(dx, dy) < 5) {
				const [mapX, mapY] = screenToMap(startPanX, startPanY);
				const provId = getProvinceIdAt(mapX, mapY);
				if (provId && provId !== 0) {
					const tag = ownership[provId];
					if (tag) {
						selectCountry(tag);
					}
				}
			}
		}
		return;
	}

	if (!isDragging) return;
	isDragging = false;

	const [mapX, mapY] = screenToMap(e.clientX, e.clientY);
	const newSelection = new Set();

	if (activeTool === "box" && selectionBox) {
		selectionBox.endX = mapX;
		selectionBox.endY = mapY;

		const minX = Math.min(selectionBox.startX, selectionBox.endX);
		const maxX = Math.max(selectionBox.startX, selectionBox.endX);
		const minY = Math.min(selectionBox.startY, selectionBox.endY);
		const maxY = Math.max(selectionBox.startY, selectionBox.endY);

		const dx = maxX - minX;
		const dy = maxY - minY;

		if (dx < 3 && dy < 3) {
			// Single click
			if (selectionBox.startX >= 0 && selectionBox.startY >= 0 && selectionBox.startX < img.width && selectionBox.startY < img.height) {
				const key = getProvinceIdAt(selectionBox.startX, selectionBox.startY);
				if (key && key !== 0 && provinceCenters[key]) {
					if (colorPickerMode) {
						const clickedCountry = ownership[key];
						if (clickedCountry && clickedCountry !== selectedColor) {
							const targetColor = countries[clickedCountry].color;
							recolourCountry(selectedColor, targetColor);
						}
						colorPickerMode = false;
						const btn = document.getElementById("btnColorPickerTool");
						if (btn) {
							btn.style.background = "#333";
							btn.style.color = "white";
							btn.style.border = "1px solid #555";
						}
						canvas.style.cursor = "default";
						selectionBox = null;
						return;
					}
					if (e.shiftKey) {
						const clickedCountry = ownership[key];
						if (clickedCountry && countries[clickedCountry]) {
							const name = prompt("Rename country:", countries[clickedCountry].name);
							if (name) {
								renameCountry(clickedCountry, name);
								updateCountryList();
							}
						}
						selectionBox = null;
						return;
					}
					newSelection.add(key);
					
					// Show details in panel
					const d = definitions[key];
					if (d) {
						document.getElementById("pnlId").textContent = key;
						document.getElementById("pnlColor").textContent = `[${d.color.join(", ")}]`;
						document.getElementById("pnlName").value = d.name;
						document.getElementById("pnlType").value = d.type;
						document.getElementById("pnlTerrain").value = d.terrain || "plains";
						document.getElementById("pnlDetailedTerrain").textContent = d.detailed_terrain || "None";
						document.getElementById("provincePanel").style.display = "block";
					}
				}
			}
		} else {
			// Box selection
			for (const keyStr in provinceCenters) {
				const p = provinceCenters[keyStr];
				const key = parseInt(keyStr);
				if (p && p.x >= minX && p.x <= maxX && p.y >= minY && p.y <= maxY) {
					newSelection.add(key);
				}
			}
		}
		selectionBox = null;
	} else if (activeTool === "lasso" && lassoPoints && lassoPoints.length > 2) {
		// Lasso Selection using point-in-polygon
		for (const keyStr in provinceCenters) {
			const p = provinceCenters[keyStr];
			const key = parseInt(keyStr);
			if (p && isPointInPolygon(p, lassoPoints)) {
				newSelection.add(key);
			}
		}
		lassoPoints = [];
	}

	const logicMode = document.getElementById("selLogicMode").value;
	if (newSelection.size > 0 || logicMode === "replace") {
		applySelectionLogic(newSelection);
	}

	updateSelectionStatus();
	draw();
});

canvas.addEventListener("contextmenu", e => e.preventDefault());

canvas.addEventListener("wheel", e => {
	const rect = canvas.getBoundingClientRect();
	const mouseX = e.clientX - rect.left;
	const mouseY = e.clientY - rect.top;
	
	const worldX = mouseX / zoom + offsetX;
	const worldY = mouseY / zoom + offsetY;
	
	const zoomFactor = 1.1;
	if (e.deltaY < 0) {
		zoom *= zoomFactor;
	} else {
		zoom /= zoomFactor;
	}
	
	zoom = Math.max(0.05, Math.min(zoom, 80.0));
	
	offsetX = worldX - mouseX / zoom;
	offsetY = worldY - mouseY / zoom;
	
	requestDraw();
	e.preventDefault();
});

let drawRequested = false;
function requestDraw() {
    draw();
}

let lastFrameTime = performance.now();
let fpsArray = [];

function draw() {
    if (!drawRequested) {
        drawRequested = true;
        requestAnimationFrame(() => {
            performDraw();
            drawRequested = false;
        });
    }
}

function performDraw() {
    if (!gl) return;
    
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.13, 0.13, 0.13, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(program);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, indexTexture);
    gl.uniform1i(gl.getUniformLocation(program, "u_indexTexture"), 0);

    if (lutNeedsUpdate) {
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, lutTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, lutWidth, lutHeight, 0, gl.RGBA, gl.UNSIGNED_BYTE, lutData);
        lutNeedsUpdate = false;
    }
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, lutTexture);
    gl.uniform1i(gl.getUniformLocation(program, "u_lutTexture"), 1);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, heightmapTexture);
    gl.uniform1i(gl.getUniformLocation(program, "u_heightmapTexture"), 2);

    gl.uniform2f(gl.getUniformLocation(program, "u_offset"), offsetX, offsetY);
    gl.uniform1f(gl.getUniformLocation(program, "u_zoom"), zoom);
    gl.uniform2f(gl.getUniformLocation(program, "u_resolution"), canvas.width, canvas.height);
    gl.uniform2f(gl.getUniformLocation(program, "u_mapSize"), img.width, img.height);
    gl.uniform2f(gl.getUniformLocation(program, "u_texelSize"), 1.0 / img.width, 1.0 / img.height);
    gl.uniform1f(gl.getUniformLocation(program, "u_lutWidth"), lutWidth);
    gl.uniform1f(gl.getUniformLocation(program, "u_lutHeight"), lutHeight);
    gl.uniform1f(gl.getUniformLocation(program, "u_showHeightmap"), showHeightmap);
    gl.uniform1f(gl.getUniformLocation(program, "u_showBorders"), showBorders);
    gl.uniform1f(gl.getUniformLocation(program, "u_activeMapmode"), activeMapmode === "interest" ? 1.0 : 0.0);

    gl.drawArrays(gl.TRIANGLES, 0, 6);

    overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
 
	if (selectionBox) {
		overlayCtx.save();
		const x1 = (selectionBox.startX - offsetX) * zoom;
		const y1 = (selectionBox.startY - offsetY) * zoom;
		const x2 = (selectionBox.endX - offsetX) * zoom;
		const y2 = (selectionBox.endY - offsetY) * zoom;

		const x = Math.min(x1, x2);
		const y = Math.min(y1, y2);
		const w = Math.abs(x1 - x2);
		const h = Math.abs(y1 - y2);

		overlayCtx.fillStyle = "rgba(0, 120, 255, 0.15)";
		overlayCtx.fillRect(x, y, w, h);
		
		overlayCtx.strokeStyle = "rgba(0, 120, 255, 0.7)";
		overlayCtx.lineWidth = 1;
		overlayCtx.setLineDash([4, 2]);
		overlayCtx.strokeRect(x, y, w, h);
		overlayCtx.restore();
	}

    overlayCtx.setTransform(zoom, 0, 0, zoom, -offsetX * zoom, -offsetY * zoom);

    // Draw lasso path in map coordinates
    if (activeTool === "lasso" && lassoPoints && lassoPoints.length > 1) {
        overlayCtx.save();
        overlayCtx.strokeStyle = "rgba(255, 165, 0, 0.8)";
        overlayCtx.lineWidth = 2 / zoom;
        overlayCtx.fillStyle = "rgba(255, 165, 0, 0.15)";
        overlayCtx.beginPath();
        overlayCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for (let i = 1; i < lassoPoints.length; i++) {
            overlayCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        }
        overlayCtx.closePath();
        overlayCtx.fill();
        overlayCtx.stroke();
        overlayCtx.restore();
    }

    // Draw highlights for selected provinces in map coordinates
    if (selectedProvinces.size > 0) {
        overlayCtx.save();
        overlayCtx.fillStyle = "rgba(255, 0, 0, 0.4)";
        overlayCtx.strokeStyle = "rgba(255, 0, 0, 0.8)";
        overlayCtx.lineWidth = 1.5 / zoom;
        for (const pid of selectedProvinces) {
            const center = provinceCenters[pid];
            if (center) {
                overlayCtx.beginPath();
                overlayCtx.arc(center.x, center.y, 6 / zoom, 0, 2 * Math.PI);
                overlayCtx.fill();
                overlayCtx.stroke();
            }
        }
        overlayCtx.restore();
    }

    drawLabels();
    dirtyCountries.clear();

    const now = performance.now();
    const frameTime = now - lastFrameTime;
    lastFrameTime = now;
    fpsArray.push(1000 / (frameTime || 1));
    if (fpsArray.length > 30) fpsArray.shift();
    const avgFps = fpsArray.reduce((a, b) => a + b, 0) / fpsArray.length;

    if (DEBUG.panel && debugPanel) {
        window.debugPanelHeader = `
            <div style="border-bottom: 1px solid #0f0; margin-bottom: 8px; padding-bottom: 4px;">
                <b>WebGL Engine: ON</b><br>
                FPS: ${avgFps.toFixed(0)}<br>
                Frame Time: ${frameTime.toFixed(2)} ms<br>
                Zoom: ${zoom.toFixed(2)}x<br>
                Offset: (${offsetX.toFixed(0)}, ${offsetY.toFixed(0)})
            </div>
        `;
    }
}

function resamplePath(path, count){

	const lengths = [0];

	for (let i = 1; i < path.length; i++) {
		const dx = path[i][0] - path[i - 1][0];
		const dy = path[i][1] - path[i - 1][1];
		lengths[i] = lengths[i - 1] + Math.hypot(dx, dy);
	}

    const total=lengths[lengths.length-1];
    const step=total/(count-1);

    const result=[];
    let j=0;

    for(let i=0;i<count;i++){
        const target=i*step;

        while(j < lengths.length-2 && lengths[j+1] < target) j++;

        const t=(target-lengths[j])/(lengths[j+1]-lengths[j]||1);

        const x=path[j][0]*(1-t)+path[j+1][0]*t;
        const y=path[j][1]*(1-t)+path[j+1][1]*t;

        result.push([x,y]);
    }

    return result;
}
function drawLabels(){
	if (zoom >= 1.5) {
		if (DEBUG.panel) {
			debugPanel.innerHTML = window.debugPanelHeader || "";
		}
		return;
	}
	const ctx = overlayCtx;

	ctx.globalAlpha = 1;
	ctx.lineWidth = 1;

	if(DEBUG.panel){
		debugPanel.innerHTML = window.debugPanelHeader || "";
	}

    const w=baseCanvas.width, h=baseCanvas.height;
    const data=basePixels;

	// Simple and fast Priority Queue implementation for Dijkstra
	class MinHeap {
		constructor() {
			this.heap = [];
		}
		push(item) {
			this.heap.push(item);
			let n = this.heap.length - 1;
			while (n > 0) {
				let parentN = Math.floor((n + 1) / 2) - 1;
				if (this.heap[n][1] >= this.heap[parentN][1]) break;
				let temp = this.heap[parentN];
				this.heap[parentN] = this.heap[n];
				this.heap[n] = temp;
				n = parentN;
			}
		}
		pop() {
			if (this.heap.length === 0) return null;
			const min = this.heap[0];
			const end = this.heap.pop();
			if (this.heap.length > 0) {
				this.heap[0] = end;
				let n = 0;
				const len = this.heap.length;
				while (true) {
					let child2N = (n + 1) * 2;
					let child1N = child2N - 1;
					let swap = null;
					if (child1N < len && this.heap[child1N][1] < this.heap[n][1]) {
						swap = child1N;
					}
					if (child2N < len && this.heap[child2N][1] < (swap === null ? this.heap[n][1] : this.heap[child1N][1])) {
						swap = child2N;
					}
					if (swap === null) break;
					let temp = this.heap[n];
					this.heap[n] = this.heap[swap];
					this.heap[swap] = temp;
					n = swap;
				}
			}
			return min;
		}
		isEmpty() {
			return this.heap.length === 0;
		}
	}
	
	function computeSpineForComponent(component, countryColor){
		if (component.length < 2) {
			return { spine: [], path: [], controlPoints: [] };
		}

		const compSet = new Set(component);

		// Calculate depth (distance to boundary) for each province in the component
		const depth = {};
		const depthQueue = [];

		for (const id of component) {
			let isBoundary = false;
			const neighbors = provinceNeighbors[id] || [];
			if (neighbors.size < 4) {
				isBoundary = true;
			}
			for (const n of neighbors) {
				if (!compSet.has(n)) {
					isBoundary = true;
					break;
				}
			}
			if (isBoundary) {
				depth[id] = 1;
				depthQueue.push(id);
			}
		}

		// Fallback
		if (depthQueue.length === 0 && component.length > 0) {
			depth[component[0]] = 1;
			depthQueue.push(component[0]);
		}

		let depthQueueHead = 0;
		while (depthQueueHead < depthQueue.length) {
			const curr = depthQueue[depthQueueHead++];
			const currDepth = depth[curr];

			for (const n of provinceNeighbors[curr] || []) {
				if (compSet.has(n) && depth[n] === undefined) {
					depth[n] = currDepth + 1;
					depthQueue.push(n);
				}
			}
		}

		// Find max depth
		let maxD = 1;
		for (const id of component) {
			if (depth[id] > maxD) maxD = depth[id];
		}

		function getFurthestNode(startId) {
			const dist = {};
			for (const id of component) dist[id] = Infinity;
			dist[startId] = 0;
			
			const pq = new MinHeap();
			pq.push([startId, 0]);

			while (!pq.isEmpty()) {
				const [curr, currCost] = pq.pop();

				if (currCost > dist[curr]) continue;

				const currCenter = provinceCenters[curr];
				if (!currCenter) continue;

				for (const n of provinceNeighbors[curr] || []) {
					if (!compSet.has(n)) continue;

					const nCenter = provinceCenters[n];
					if (!nCenter) continue;

					const stepDist = Math.hypot(currCenter.x - nCenter.x, currCenter.y - nCenter.y);
					const nextCost = currCost + stepDist;

					if (nextCost < dist[n]) {
						dist[n] = nextCost;
						pq.push([n, nextCost]);
					}
				}
			}

			let furthestId = startId;
			let maxDist = -1;
			for (const id of component) {
				if (dist[id] !== Infinity && dist[id] > maxDist) {
					maxDist = dist[id];
					furthestId = id;
				}
			}
			return { id: furthestId, dist: maxDist };
		}

		// 1. Geodesic extremities using 2-pass Dijkstra
		const res1 = getFurthestNode(component[0]);
		const res2 = getFurthestNode(res1.id);
		const A_geo = res1.id;
		const B_geo = res2.id;
		const S_geo = res2.dist;

		// 2. Optimal straight line search
		let A_straight = component[0];
		let B_straight = component[0];
		let bestStraightScore = -Infinity;
		let L_straight = 0;
		let bestOutsideCount = 0;

		function isInside(x, y) {
			const key = getProvinceIdAt(x, y);
			return compSet.has(key);
		}

		// Subsample candidate list when there are many provinces to avoid O(N^2) complexity
		const candidates = [];
		const maxCandidates = 60;
		if (component.length <= maxCandidates) {
			for (let i = 0; i < component.length; i++) candidates.push(component[i]);
		} else {
			const step = Math.ceil(component.length / maxCandidates);
			for (let i = 0; i < component.length; i += step) {
				candidates.push(component[i]);
			}
		}

		for (let i = 0; i < candidates.length; i++) {
			for (let j = i + 1; j < candidates.length; j++) {
				const idA = candidates[i];
				const idB = candidates[j];
				const pA = provinceCenters[idA];
				const pB = provinceCenters[idB];
				if (!pA || !pB) continue;

				const dist = Math.hypot(pB.x - pA.x, pB.y - pA.y);
				// Critical Optimization: Skip candidate check if distance is less than current best score
				if (dist <= bestStraightScore) continue;

				// Sample 20 points along the straight line to accurately detect water crossings
				let outsideCount = 0;
				for (let k = 1; k <= 20; k++) {
					const t = k / 21;
					const sx = pA.x * (1 - t) + pB.x * t;
					const sy = pA.y * (1 - t) + pB.y * t;
					if (!isInside(sx, sy)) {
						outsideCount++;
					}
				}

				const score = dist - 100 * outsideCount;
				if (score > bestStraightScore) {
					bestStraightScore = score;
					A_straight = idA;
					B_straight = idB;
					L_straight = dist;
					bestOutsideCount = outsideCount;
				}
			}
		}

		// 3. Classification using Asymmetry relative to the Optimal Straight Line
		const pA = provinceCenters[A_straight];
		const pB = provinceCenters[B_straight];
		const A_line = pB.y - pA.y;
		const B_line = -(pB.x - pA.x);
		const C_line = pB.x * pA.y - pB.y * pA.x;

		let leftArea = 0;
		let rightArea = 0;
		for (const id of component) {
			const p = provinceCenters[id];
			if (!p) continue;
			const val = A_line * p.x + B_line * p.y + C_line;
			if (val > 0) {
				leftArea += p.count;
			} else {
				rightArea += p.count;
			}
		}
		const totalArea = leftArea + rightArea;
		const asymmetry = totalArea > 0 ? Math.abs(leftArea - rightArea) / totalArea : 0;

		// Dynamically compute tension using asymmetry:
		let tension = 0.0;
		const dy_line = Math.abs(pB.y - pA.y);
		const dx_line = Math.abs(pB.x - pA.x);
		if (bestOutsideCount === 0 && asymmetry >= 0.10 && dy_line <= dx_line) {
			tension = Math.min(0.22, (asymmetry - 0.10) * 2.0);
		}

		let A = A_straight;
		let B = B_straight;

		// Re-order A and B to ensure natural reading: South-to-North / Left-to-Right
		const centerA = provinceCenters[A];
		const centerB = provinceCenters[B];
		if (centerA && centerB) {
			const dx = Math.abs(centerA.x - centerB.x);
			const dy = Math.abs(centerA.y - centerB.y);
			if (dx > dy) {
				if (centerA.x > centerB.x) {
					const temp = A; A = B; B = temp;
				}
			} else {
				if (centerA.y < centerB.y) {
					const temp = A; A = B; B = temp;
				}
			}
		}

		// Dijkstra's algorithm to find the depth-weighted path from A to B
		function dijkstra(start, end) {
			const dist = {};
			const prev = {};
			for (const id of component) {
				dist[id] = Infinity;
			}
			dist[start] = 0;
			
			const pq = new MinHeap();
			pq.push([start, 0]);

			while (!pq.isEmpty()) {
				const [curr, currCost] = pq.pop();

				if (curr === end) break;
				if (currCost > dist[curr]) continue;

				for (const n of provinceNeighbors[curr] || []) {
					if (!compSet.has(n)) continue;

					// Mild depth cost: 1 + (maxD - depth) * 0.25
					const moveCost = 1 + (maxD - (depth[n] || 1)) * 0.25;
					const nextCost = currCost + moveCost;

					if (nextCost < dist[n]) {
						dist[n] = nextCost;
						prev[n] = curr;
						pq.push([n, nextCost]);
					}
				}
			}

			const path = [];
			let cur = end;
			while (cur !== undefined) {
				path.push(cur);
				cur = prev[cur];
			}
			path.reverse();
			return path;
		}

		const pathIds = dijkstra(A, B);
		const path = [];
		for (const id of pathIds) {
			const p = provinceCenters[id];
			if (p) path.push([p.x, p.y]);
		}

		if (path.length < 2) {
			return { spine: path, path: path, controlPoints: [], tension };
		}

		const P0 = [...path[0]];
		const P3 = [...path[path.length - 1]];

		if (path.length < 4) {
			// Linear interpolation (straight line spine)
			const spine = [];
			for (let i = 0; i < 80; i++) {
				const t = i / 79;
				const x = P0[0] * (1 - t) + P3[0] * t;
				const y = P0[1] * (1 - t) + P3[1] * t;
				spine.push([x, y]);
			}
			return { spine, path, controlPoints: [], tension };
		}

		// Calculate cumulative length along the Dijkstra path to find geometric 1/3 and 2/3 points
		const pathLengths = [0];
		for (let i = 1; i < path.length; i++) {
			pathLengths[i] = pathLengths[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
		}
		const pathTotalLen = pathLengths[pathLengths.length - 1];

		function getPathPointAt(dist) {
			for (let i = 1; i < pathLengths.length; i++) {
				if (pathLengths[i] >= dist) {
					const a = path[i - 1];
					const b = path[i];
					const t = (dist - pathLengths[i - 1]) / (pathLengths[i] - pathLengths[i - 1] || 1);
					return [
						a[0] * (1 - t) + b[0] * t,
						a[1] * (1 - t) + b[1] * t
					];
				}
			}
			return [...path[path.length - 1]];
		}

		const M_dijkstra = getPathPointAt(pathTotalLen * 0.5);
		const M_straight = [
			(P0[0] + P3[0]) / 2,
			(P0[1] + P3[1]) / 2
		];

		const M = [
			(1 - tension) * M_straight[0] + tension * M_dijkstra[0],
			(1 - tension) * M_straight[1] + tension * M_dijkstra[1]
		];

		if (tension > 0.0) {
			// Compute area-weighted centroid of the component to determine the correct bend direction
			let sumX = 0, sumY = 0, totalPCount = 0;
			for (const id of component) {
				const p = provinceCenters[id];
				if (p) {
					sumX += p.x * p.count;
					sumY += p.y * p.count;
					totalPCount += p.count;
				}
			}
			const M_centroid = [sumX / (totalPCount || 1), sumY / (totalPCount || 1)];

			// Find bend direction
			const vx = M_centroid[0] - M_straight[0];
			const vy = M_centroid[1] - M_straight[1];
			const v_len = Math.hypot(vx, vy);

			if (v_len > 0.1) {
				const ux = vx / v_len;
				const uy = vy / v_len;

				let maxProj = -Infinity;
				let bestId = component[0];

				for (const id of component) {
					const p = provinceCenters[id];
					if (!p) continue;
					const proj = (p.x - M_straight[0]) * ux + (p.y - M_straight[1]) * uy;
					if (proj > maxProj) {
						maxProj = proj;
						bestId = id;
					}
				}

				const pC = provinceCenters[bestId];
				if (pC) {
					const pull = Math.min(0.5, tension * 1.5);
					M[0] = (1 - pull) * M_straight[0] + pull * pC.x;
					M[1] = (1 - pull) * M_straight[1] + pull * pC.y;
				}

				// Calculate component area and thickness
				let compArea = 0;
				for (const id of component) {
					const center = provinceCenters[id];
					if (center) compArea += center.count;
				}
				const thickness = Math.max(16, Math.min(100, Math.sqrt(compArea) * 0.45));

				// Shift the entire curve in the direction of the bend
				const shiftDist = thickness * 0.10;
				const shx = ux * shiftDist;
				const shy = uy * shiftDist;

				P0[0] += shx; P0[1] += shy;
				P3[0] += shx; P3[1] += shy;
				M[0] += shx; M[1] += shy;
			}
		}

		const P1 = [
			2 * M[0] - (P0[0] + P3[0]) / 2,
			2 * M[1] - (P0[1] + P3[1]) / 2
		];

		// Evaluate Bezier curve at 80 points
		const spine = [];
		for (let i = 0; i < 80; i++) {
			const t = i / 79;
			const mt = 1 - t;
			const x = mt*mt * P0[0] + 2*mt*t * P1[0] + t*t * P3[0];
			const y = mt*mt * P0[1] + 2*mt*t * P1[1] + t*t * P3[1];
			spine.push([x, y]);
		}

		if (spine.length >= 2 && spine[spine.length - 1][0] < spine[0][0]) {
			spine.reverse();
			path.reverse();
		}

		return { spine, path, controlPoints: [P1], tension };
	}

	for(const o in countries){
		const country = countries[o];
		if (!country || country.provinces.size === 0) continue;

		let text = country.name;
		if (text.toLowerCase().includes("placeholder")) {
			text = country.tag;
		}
		text = text.toUpperCase();
		
		let cached = labelCache[o];

		if (!cached || dirtyCountries.has(o)) {
			// Find contiguous components using BFS
			const provincesSet = country.provinces;
			const visited = new Set();
			const components = [];

			for (const provId of provincesSet) {
				if (visited.has(provId)) continue;

				const component = [];
				const queue = [provId];
				let queueHead = 0;
				visited.add(provId);

				while (queueHead < queue.length) {
					const curr = queue[queueHead++];
					component.push(curr);

					for (const n of provinceNeighbors[curr] || []) {
						if (provincesSet.has(n) && !visited.has(n)) {
							visited.add(n);
							queue.push(n);
						}
					}
				}
				components.push(component);
			}

			const labels = [];
			for (const comp of components) {
				if (comp.length < 4) continue; // Skip very small components

				const result = computeSpineForComponent(comp, o);
				if (result.spine.length < 2) continue;

				let compArea = 0;
				for (const id of comp) {
					const center = provinceCenters[id];
					if (center) compArea += center.count;
				}
				const thickness = Math.max(16, Math.min(100, Math.sqrt(compArea) * 0.45));
				const spine = result.spine;
				const path = result.path;
				const controlPoints = result.controlPoints;

				const P0 = spine[0];
				const P3 = spine[spine.length - 1];

				const P1 = (controlPoints && controlPoints.length > 0) ? controlPoints[0] : [
					(P0[0] + P3[0]) / 2,
					(P0[1] + P3[1]) / 2
				];

				let fontSize = Math.min(70, thickness * 0.75);

				// Precompute letter layouts to avoid slow operations at draw time
				ctx.save();
				ctx.font = `bold ${fontSize}px Georgia`;
				ctx.textAlign = "center";
				ctx.textBaseline = "middle";

				const cumulative = [0];
				for (let i = 1; i < spine.length; i++) {
					const dx = spine[i][0] - spine[i - 1][0];
					const dy = spine[i][1] - spine[i - 1][1];
					cumulative[i] = cumulative[i - 1] + Math.hypot(dx, dy);
				}
				const totalLen = cumulative[cumulative.length - 1];

				function getPointAndTangentAt(dist) {
					let t = 1;
					for (let i = 1; i < cumulative.length; i++) {
						if (cumulative[i] >= dist) {
							const t0 = (i - 1) / (spine.length - 1);
							const t1 = i / (spine.length - 1);
							const fraction = (dist - cumulative[i - 1]) / (cumulative[i] - cumulative[i - 1] || 1);
							t = t0 * (1 - fraction) + t1 * fraction;
							break;
						}
					}
					const mt = 1 - t;
					const x = mt*mt * P0[0] + 2*mt*t * P1[0] + t*t * P3[0];
					const y = mt*mt * P0[1] + 2*mt*t * P1[1] + t*t * P3[1];
					const dx = 2 * mt * (P1[0] - P0[0]) + 2 * t * (P3[0] - P1[0]);
					const dy = 2 * mt * (P1[1] - P0[1]) + 2 * t * (P3[1] - P1[1]);
					return [x, y, dx, dy];
				}

				const margin = Math.min(thickness * 0.15, totalLen * 0.04);
				const startDist = margin;
				const endDist = totalLen - margin;
				const len = endDist - startDist;

				if (len < 20) {
					ctx.restore();
					continue;
				}

				const letters = text.split('');
				const baseWidths = letters.map(ch => ctx.measureText(ch).width);
				const baseTotal = baseWidths.reduce((a, b) => a + b, 0);

				const usableLen = len;
				let scale = usableLen / (baseTotal * 1.35); 
				scale = Math.min(scale, 1);
				scale = Math.max(scale, 0.12);

				const effectiveFont = fontSize * scale * 0.85;
				ctx.font = `bold ${effectiveFont}px Georgia`;

				const w = letters.map(ch => ctx.measureText(ch).width);
				const totalW = w.reduce((a, b) => a + b, 0);
				
				let gap = letters.length > 1 ? (len - totalW) / (letters.length - 1) : 0;
				const maxGap = effectiveFont * 1.2;
				if (letters.length > 1 && gap > maxGap) {
					gap = maxGap;
				}
				
				const wordLen = totalW + (letters.length > 1 ? (letters.length - 1) * gap : 0);
				const startDistAdjusted = startDist + (len - wordLen) / 2;
				const angle_straight = Math.atan2(P3[1] - P0[1], P3[0] - P0[0]);

				const computedLetters = [];
				let currentOffset = 0;
				for (let i = 0; i < letters.length; i++) {
					const charW = w[i];
					const dist = startDistAdjusted + currentOffset + charW / 2;
					currentOffset += charW + gap;

					const [x, y, dx, dy] = getPointAndTangentAt(dist);
					const lenDir = Math.hypot(dx, dy) || 1;
					const nx = -dy / lenDir;
					const ny = dx / lenDir;

					const inward = Math.min(thickness * 0.12, effectiveFont * 0.4);
					const px = x + nx * inward;
					const py = y + ny * inward;

					const angle_local = Math.atan2(dy, dx);
					let diff = angle_local - angle_straight;
					diff = Math.atan2(Math.sin(diff), Math.cos(diff));
					
					const rotationDamping = 0.95;
					const angle = angle_straight + diff * rotationDamping;

					computedLetters.push({
						char: letters[i],
						x: px,
						y: py,
						angle: angle
					});
				}
				ctx.restore();

				labels.push({
					spine,
					path,
					controlPoints,
					thickness,
					provCount: comp.length,
					tension: result.tension,
					fontSize,
					effectiveFont,
					letters: computedLetters
				});
			}

			cached = { labels };
			labelCache[o] = cached;
		}

		// Draw curved/rotated labels along spine using cached layout
		for (const label of cached.labels) {
			const thickness = label.thickness;
			const spine = label.spine;
			const path = label.path;
			const controlPoints = label.controlPoints;

			const P0 = spine[0];
			const P3 = spine[spine.length - 1];
			
			// Viewport culling
			const minX = Math.min(P0[0], P3[0]) - thickness;
			const maxX = Math.max(P0[0], P3[0]) + thickness;
			const minY = Math.min(P0[1], P3[1]) - thickness;
			const maxY = Math.max(P0[1], P3[1]) + thickness;
			
			const vpLeft = offsetX;
			const vpRight = offsetX + canvas.width / zoom;
			const vpTop = offsetY;
			const vpBottom = offsetY + canvas.height / zoom;
			
			if (maxX < vpLeft || minX > vpRight || maxY < vpTop || minY > vpBottom) {
				continue;
			}

			if(DEBUG.axis){
				ctx.save();
				ctx.strokeStyle = "rgba(255, 100, 0, 0.6)"; // Dijkstra axis
				ctx.lineWidth = 1.5;
				ctx.beginPath();
				for(let i=0;i<path.length;i++){
					const [x,y] = path[i];
					if(i===0) ctx.moveTo(x, y);
					else ctx.lineTo(x, y);
				}
				ctx.stroke();
				ctx.restore();
			}

			if(DEBUG.bezier){
				ctx.save();
				ctx.strokeStyle = "cyan"; // Bezier curve
				ctx.lineWidth = 2.5;
				ctx.beginPath();
				for(let i=0;i<spine.length;i++){
					const [x,y] = spine[i];
					if(i===0) ctx.moveTo(x, y);
					else ctx.lineTo(x, y);
				}
				ctx.stroke();
				ctx.restore();
			}

			if(DEBUG.points && controlPoints && controlPoints.length > 0){
				ctx.save();
				ctx.fillStyle = "red";
				for(const pt of controlPoints){
					ctx.beginPath();
					ctx.arc(pt[0], pt[1], 4, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.restore();
			}

			if (label.fontSize * zoom < 7.5) {
				continue;
			}

			ctx.font = `bold ${label.effectiveFont}px Georgia`;
			ctx.fillStyle = "white";
			ctx.strokeStyle = "black";
			ctx.lineJoin = "round";
			ctx.miterLimit = 2;
			ctx.lineWidth = Math.max(0.1, label.effectiveFont * 0.05);

			ctx.textAlign = "center";
			ctx.textBaseline = "middle";

			for (let i = 0; i < label.letters.length; i++) {
				const letObj = label.letters[i];
				ctx.save();
				ctx.translate(letObj.x, letObj.y);
				ctx.rotate(letObj.angle);
				ctx.fillText(letObj.char, 0, 0);
				ctx.strokeText(letObj.char, 0, 0);
				ctx.restore();
			}
		}
	}
}
// Convenient hotkey listeners
window.addEventListener("keydown", (e) => {
    // Skip if typing in inputs/selects
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") {
        return;
    }
    
    const key = e.key.toLowerCase();
    if (key === "b") {
        setTool("box");
    } else if (key === "l") {
        setTool("lasso");
    } else if (key === "h") {
        setTool("pan");
    } else if (key === "p") {
        activateColorPickerTool();
    } else if (key === "e") {
        setEraser();
    } else if (key === "c") {
        clearSelection();
    } else if (key === "f" || e.key === "Enter") {
        paintSelection();
    } else if (key === "s") {
        selectAllProvincesOfSelectedCountry();
    } else if (key === "i") {
        paintInterest();
    } else if (["1", "2", "3", "4", "5"].includes(key)) {
        const select = document.getElementById("selLogicMode");
        if (select) {
            const modes = ["replace", "add", "subtract", "intersect", "xor"];
            select.value = modes[parseInt(key) - 1];
        }
    }
});
</script>
